[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flybird"
version = "0.1.0"
description = "Reproducible Flappy Bird circuit-removal video experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "Pillow>=10.4", "pyarrow>=19", "scipy>=1.15"]

[project.scripts]
flybird = "flybird.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
